---

- name: setup directories
  file: path=/Users/mahmoud/.common_env state=directory

- name: copy and install common environment files
  file: src=/Users/mahmoud/dotfiles/files/common_env/{{ item }}
        path=/Users/mahmoud/.common_env/{{ item }}
        state=link
  with_items:
    - aliases.sh
    - exports_bash.sh
    - funcs_bash.sh
    - sourcer.sh

- name: ensure ~/Library/Preferences exists
  file: path=/Users/mahmoud/Library/Preferences state=directory
  when: ansible_distribution == 'MacOSX'

# User-level rather than /etc/nsmb.conf so this needs no sudo and touches no
# system files. Note: if /etc/nsmb.conf exists on a machine it takes precedence
# for any key both files set, so remove it there if you want this one to rule.
- name: install user-level SMB client configuration
  file: src=/Users/mahmoud/dotfiles/files/macos/nsmb.conf
        path=/Users/mahmoud/Library/Preferences/nsmb.conf
        state=link
        force=yes
  when: ansible_distribution == 'MacOSX'

