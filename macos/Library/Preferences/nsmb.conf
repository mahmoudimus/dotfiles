# nsmb.conf - stow package `macos`, lands at ~/Library/Preferences/nsmb.conf
#------------------------------------------------------------------------------
# User-level SMB client configuration. Deliberately user-level rather than
# /etc/nsmb.conf so provisioning needs no sudo and touches no system files.
#
# Precedence, verified on macOS 26.5: if /etc/nsmb.conf also exists, it WINS
# for any key both files set. A key only this file sets is still honoured. On a
# fresh machine there is no /etc/nsmb.conf, so everything below applies.
#------------------------------------------------------------------------------
# Reference:
# https://support.apple.com/en-us/HT211927
# https://support.apple.com/en-us/HT208209
# https://apple.stackexchange.com/questions/309016/smb-share-deadlocks-since-high-sierra
# https://support.apple.com/en-us/HT212277
#------------------------------------------------------------------------------
[default]

# Do not create submounts when the server exposes a reparse point, junction or
# DFS referral. Without this, walking a Windows share whose junctions form a
# cycle makes the SMB client mount a new volume per level, without bound. One
# `find` over such a share produced ~700 mounts here, after which every
# free-space query on the machine cost ~345ms instead of ~10ms because
# CacheDelete rescans the whole mount table per call.
#
# Cost of this setting: DFS namespace traversal stops working. Enable per
# server with a [SERVERNAME] section instead if you ever point at a DFS root.
submounts_off=yes

# Disable signing due to macOS bug (decreases security)
signing_required=no
# Disable SMB session signing (decreases security)
validate_neg_off=yes

# Use NTFS streams (named streams) if supported (neutral, but could impact performance)
streams=yes

# Turn off notifications
# Disable change notifications (neutral, but might affect operational efficiency)
notify_off=yes

# Set hard or soft mount of shares
# Hard mount: a request is issued repeatedly until the request is satisfied.
# Soft mount: tried until completed, the retry limit is met or the timeout limit is met.
# Enable soft mounts by default (neutral, but could impact data availability)
soft=yes

# Disable directory caching (neutral, but impacts performance)
dir_cache_off=yes
dir_cache_max_cnt=0
dir_cache_max=0

# Lock negotiation to SMB2/3 only
# 7 == 0111  SMB 1/2/3 should be enabled
# 6 == 0110  SMB 2/3 should be enabled
# 4 == 0100  SMB 3 should be enabled
# 2 ==       SMB2 only
protocol_vers_map=4

# How to use SMB TCP/UDP ports.
# normal:       Try port 445, fall back to NetBIOS.
# netbios_only: Do not attempt port 445.
# no_netbios:   Try port 445, do not fall back to NetBIOS.
#
# sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.netbiosd.plist
# No SMB1, so we disable NetBIOS
port445=no_netbios

# SMB Multichannel behavior
mc_on=yes
# Some Wi-Fi networks advertise faster speeds than the connected wired network.
mc_prefer_wired=yes

# Setting file_ids to yes allows the local finder to refresh itself
# properly and show changes to files that are made on sharepoints.
file_ids_off=yes
